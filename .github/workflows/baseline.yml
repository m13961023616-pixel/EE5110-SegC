name: Baseline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python312:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install simulation dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and verify pinned Panda assets
        run: python scripts/setup_assets.py
      - name: Verify resumable locked asset downloads
        run: python tests/test_asset_setup.py
      - name: Run failure and reset regression checks
        run: python tests/test_baseline.py
      - name: Audit frozen source and 600-scene performance evidence
        run: python scripts/check_reliability_evidence.py --source-ref v1.1.0
      - name: Run fixed-cube physics smoke test
        run: python main.py --headless --dataset cube --task place --fixed --require-all-success
      - name: Download and verify pinned YCB assets
        run: python scripts/setup_ycb.py
      - name: Run dataset integration checks
        run: python tests/test_dataset.py
      - name: Run real-mesh physics smoke test
        run: python main.py --headless --object foam_brick --task place --fixed --require-all-success
      - name: Check obstacle search and physical transport
        run: python tests/test_obstacle_planning.py
      - name: Audit paired obstacle experiment evidence
        run: python scripts/check_obstacle_evidence.py --source-ref v1.2.0
      - name: Check obstacle reliability regressions
        run: python tests/test_robust_obstacles.py
      - name: Audit exact-version obstacle reliability comparisons
        run: python scripts/check_obstacle_reliability.py
